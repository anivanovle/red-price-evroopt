services:
  migrate:
    build: .
    command: ["./app", "migrate"]
    volumes:
      - ./.env:/app/.env
    depends_on:
      db:
        condition: service_healthy
    restart: "no" 

  app:
    build: .
    ports:
      - "8081:80"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./.env:/app/.env
    restart: always 

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: test3
    volumes:
      - ./db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d test3"]
      interval: 5s
      timeout: 3s
      retries: 5


